name: chaincode tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - chaincode/batch-registry
          - chaincode/coldchain-compliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: install
        working-directory: ${{ matrix.package }}
        run: npm install
      - name: test
        working-directory: ${{ matrix.package }}
        run: npm test
